[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climaexplore"
version = "0.1.0"
description = "Modular PyQt5 Desktop Application for Climate Data Exploration, Deep Learning, Wavelet Analysis, and Geospatial Visualization."
readme = "README.md"
authors = [{ name = "ClimaExplore Team" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
requires-python = ">=3.8"
dependencies = [
    "PyQt5>=5.15.0",
    "matplotlib>=3.3.0",
    "numpy>=1.20.0",
    "pandas>=1.2.0",
    "torch>=1.9.0",
    "pyinstaller>=5.0.0",
    "sphinx>=4.0.0"
]

[project.scripts]
climaexplore = "climaexplore.main:main"
